name: Secrets疎通テスト

on:
  workflow_dispatch:  # 手動実行を許可
    inputs:
      reason:
        description: 'テストを実行する理由（任意）'
        required: false
        default: '定期的な疎通確認'
      show_details:
        description: '詳細情報を表示（サーバー名・Bot名を取得、Step SummaryでリポジトリのActions権限を持つユーザーが閲覧可能）'
        required: false
        type: boolean
        default: false
      test_gemini:
        description: 'Gemini API疎通テストを実行（無料枠を消費します）'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test-secrets.yml'
      - 'src/test_connection.py'
      - 'src/test_gemini_connection.py'

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Pythonをセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discord疎通テストを実行
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TARGET_GUILD_ID: ${{ secrets.TARGET_GUILD_ID }}
          SHOW_DETAILS: ${{ github.event.inputs.show_details || 'false' }}
        run: |
          echo "🔍 Discord Secrets疎通テストを開始します"
          echo "実行理由: ${{ github.event.inputs.reason || '自動実行' }}"
          echo "詳細情報表示: ${{ github.event.inputs.show_details || 'false' }}"
          echo ""
          python src/test_connection.py

      - name: Gemini API疎通テストを実行
        if: github.event.inputs.test_gemini == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo ""
          echo "🔍 Gemini API疎通テストを開始します"
          echo ""
          python src/test_gemini_connection.py

      - name: テスト結果をサマリーに出力
        if: always()
        run: |
          if [ '${{ job.status }}' == 'success' ]; then
            echo "## ✅ Secrets疎通テスト: 成功" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "疎通テストに成功しました。" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Discord接続" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ DISCORD_TOKENの有効性" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Discord APIへの接続" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ TARGET_GUILD_IDで指定されたサーバーへのアクセス" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "${{ github.event.inputs.test_gemini }}" == "true" ]; then
              echo "### Gemini API接続" >> $GITHUB_STEP_SUMMARY
              echo "- ✅ GEMINI_API_KEYの有効性" >> $GITHUB_STEP_SUMMARY
              echo "- ✅ Gemini APIへの接続" >> $GITHUB_STEP_SUMMARY
              echo "- ✅ Gemini APIを使用した応答生成が利用可能" >> $GITHUB_STEP_SUMMARY
            else
              echo "### Gemini API接続" >> $GITHUB_STEP_SUMMARY
              if [ "${{ github.event_name }}" == "push" ]; then
                echo "- ⏭️ スキップ（自動実行時は実行されません）" >> $GITHUB_STEP_SUMMARY
              else
                echo "- ⏭️ スキップ（手動実行時にオプションで有効化可能）" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          else
            echo "## ❌ Secrets疎通テスト: 失敗" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "疎通テストに失敗しました。以下を確認してください:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Discord接続の確認事項" >> $GITHUB_STEP_SUMMARY
            echo "1. **DISCORD_TOKEN**: 正しいBot トークンが" >> $GITHUB_STEP_SUMMARY
            echo "   設定されているか" >> $GITHUB_STEP_SUMMARY
            echo "2. **TARGET_GUILD_ID**: 正しいサーバーIDが" >> $GITHUB_STEP_SUMMARY
            echo "   設定されているか" >> $GITHUB_STEP_SUMMARY
            echo "3. **Bot権限**: Botがサーバーに" >> $GITHUB_STEP_SUMMARY
            echo "   Joinしているか" >> $GITHUB_STEP_SUMMARY
            echo "4. **Intent設定**: Discord Developer Portalで" >> $GITHUB_STEP_SUMMARY
            echo "   必要なIntentsが有効化されているか" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "${{ github.event.inputs.test_gemini }}" == "true" ]; then
              echo "### Gemini API接続の確認事項" >> $GITHUB_STEP_SUMMARY
              echo "1. **GEMINI_API_KEY**: 正しいAPIキーが" >> $GITHUB_STEP_SUMMARY
              echo "   設定されているか" >> $GITHUB_STEP_SUMMARY
              echo "2. **APIキーの有効性**: Google AI Studioで" >> $GITHUB_STEP_SUMMARY
              echo "   APIキーが有効か確認" >> $GITHUB_STEP_SUMMARY
              echo "3. **レート制限**: 無料枠の制限に" >> $GITHUB_STEP_SUMMARY
              echo "   達していないか確認" >> $GITHUB_STEP_SUMMARY
              echo "4. **インターネット接続**: APIへの接続が" >> $GITHUB_STEP_SUMMARY
              echo "   可能か確認" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
            echo "詳細なエラー内容は上記のログを確認してください。" >> $GITHUB_STEP_SUMMARY
          fi
