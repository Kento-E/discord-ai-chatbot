name: Discord Botの実行

on:
  workflow_dispatch:  # 手動実行を許可
    inputs:
      reason:
        description: 'Botを起動する理由（任意）'
        required: false
        default: '手動起動'
      timeout_minutes:
        description: '実行時間の上限（分）。最大360分（6時間）'
        required: false
        default: '60'
        type: choice
        options:
          - '30'
          - '60'
          - '120'
          - '180'
          - '360'
      debug_mode:
        description: 'デバッグモード（ログを即座に出力）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_minutes || '60') }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Pythonをセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 最新の知識データReleaseを取得
        id: get-latest-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📦 最新の知識データReleaseを検索中..."

          # knowledge-data-* タグの最新Releaseを取得
          LATEST_RELEASE=$(gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("knowledge-data-"))] | sort_by(.createdAt) | reverse | .[0].tagName')

          if [ -z "$LATEST_RELEASE" ] || [ "$LATEST_RELEASE" = "null" ]; then
            echo "❌ エラー: 知識データのReleaseが見つかりません"
            echo ""
            echo "知識データを生成するには、以下のワークフローを実行してください:"
            echo "  Actions → '知識データの生成と保存' → Run workflow"
            echo ""
            echo "詳細: .github/workflows/ENCRYPTION_KEY_SETUP.md を参照"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ 最新Release: ${LATEST_RELEASE}"
          echo "tag_name=${LATEST_RELEASE}" >> $GITHUB_OUTPUT
          echo "found=true" >> $GITHUB_OUTPUT

      - name: 暗号化された知識データをダウンロード
        id: download-knowledge
        if: steps.get-latest-release.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.get-latest-release.outputs.tag_name }}"
          echo "📥 知識データをダウンロード中: ${TAG_NAME}"

          # Releaseからknowledge-data.encをダウンロード
          gh release download "${TAG_NAME}" \
            --pattern "knowledge-data.enc" \
            --dir . \
            --clobber

          if [ -f knowledge-data.enc ]; then
            echo "✅ ダウンロード完了"
            ls -lh knowledge-data.enc
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ エラー: ダウンロードに失敗しました"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: 知識データを復号化
        if: steps.download-knowledge.outputs.success == 'true'
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          echo "🔓 知識データを復号化中..."

          if [ -f knowledge-data.enc ]; then
            if openssl enc -aes-256-cbc -d -pbkdf2 -pass env:ENCRYPTION_KEY -in knowledge-data.enc | tar xzf - -C ./; then
              echo "✅ 復号化完了"
              ls -la data/
            else
              echo "❌ エラー: 復号化に失敗しました"
              echo "暗号鍵(ENCRYPTION_KEY)が正しいか確認してください"
              exit 1
            fi
          else
            echo "⚠️ 暗号化データファイルが見つかりません"
            exit 1
          fi

      - name: 知識データの確認
        run: |
          if [ -f data/knowledge.db ]; then
            echo "✅ 知識データが利用可能です（データベースモード）"
          elif [ -f data/embeddings.json ]; then
            echo "✅ 知識データが利用可能です（JSONモード）"
          else
            echo "❌ エラー: 知識データが存在しません"
            echo ""
            echo "知識データを生成するには、以下のワークフローを実行してください:"
            echo "  Actions → '知識データの生成と保存' → Run workflow"
            echo ""
            echo "詳細: .github/workflows/ENCRYPTION_KEY_SETUP.md を参照"
            exit 1
          fi

      - name: Gemini APIモデルの有効性を確認
        id: validate-model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo ""
          if ! python src/validate_gemini_model.py; then
            echo "::warning::⚠️ Gemini APIモデルの更新が必要です。詳細はログを確認してください。"
            echo "model_outdated=true" >> $GITHUB_OUTPUT
          else
            echo "model_outdated=false" >> $GITHUB_OUTPUT
          fi
          echo ""

      - name: Discord Botを起動
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TARGET_GUILD_ID: ${{ secrets.TARGET_GUILD_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADDITIONAL_CHATBOT_ROLE: ${{ secrets.ADDITIONAL_CHATBOT_ROLE }}
          PYTHONUNBUFFERED: ${{ github.event.inputs.debug_mode == 'true' && '1' || '0' }}
        run: |
          echo "🤖 Discord Botを起動します"
          echo "起動理由: ${{ github.event.inputs.reason || '手動起動' }}"
          echo "実行時間上限: ${{ github.event.inputs.timeout_minutes || '60' }}分"
          if [ "${{ github.event.inputs.debug_mode }}" == "true" ]; then
            echo "🔍 デバッグモード: 有効"
          fi
          echo ""
          echo "⚠️ 注意: GitHub Actionsの制限により、最大6時間（360分）まで実行可能です"
          echo "⚠️ タイムアウトに達すると自動的に停止します"
          echo ""
          echo "🔄 Botを起動しています..."
          if [ "${{ github.event.inputs.debug_mode }}" == "true" ]; then
            python -u src/main.py
          else
            python src/main.py
          fi

      - name: 実行結果をサマリーに出力
        if: always()
        run: |
          if [ '${{ job.status }}' == 'success' ]; then
            echo "## ✅ Discord Bot: 正常終了" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Botは正常に終了しました。" >> $GITHUB_STEP_SUMMARY
          elif [ '${{ job.status }}' == 'cancelled' ]; then
            echo "## ⏹️ Discord Bot: キャンセル" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Botの実行がキャンセルされました。" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Discord Bot: エラー終了" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Botの実行中にエラーが発生しました。" >> $GITHUB_STEP_SUMMARY
            echo "詳細なエラー内容は上記のログを確認してください。" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 確認事項" >> $GITHUB_STEP_SUMMARY
            echo "1. **知識データ**: '知識データの生成と保存' ワークフローを実行済みか" >> $GITHUB_STEP_SUMMARY
            echo "2. **DISCORD_TOKEN**: 正しいBot トークンが設定されているか" >> $GITHUB_STEP_SUMMARY
            echo "3. **TARGET_GUILD_ID**: 正しいサーバーIDが設定されているか" >> $GITHUB_STEP_SUMMARY
            echo "4. **ENCRYPTION_KEY**: 暗号鍵が正しく設定されているか" >> $GITHUB_STEP_SUMMARY
            echo "5. **Bot権限**: Botがサーバーに参加しているか" >> $GITHUB_STEP_SUMMARY
            echo "6. **Intent設定**: Discord Developer Portalで必要なIntentsが有効化されているか" >> $GITHUB_STEP_SUMMARY
            echo "   - MESSAGE CONTENT INTENT" >> $GITHUB_STEP_SUMMARY
            echo "   - SERVER MEMBERS INTENT" >> $GITHUB_STEP_SUMMARY
            echo "   - GUILDS INTENT" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Gemini APIモデル検証結果を追加
          if [ "${{ steps.validate-model.outputs.model_outdated }}" == "true" ]; then
            echo "### ⚠️ 重要な警告" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Gemini APIモデルの更新が必要です**" >> $GITHUB_STEP_SUMMARY
            echo "- 現在のモデルが利用できない可能性があります" >> $GITHUB_STEP_SUMMARY
            echo "- Gemini APIを使用した応答生成が正常に動作しない可能性があります" >> $GITHUB_STEP_SUMMARY
            echo "- 詳細は上記のログ「Gemini APIモデルの有効性を確認」を参照してください" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 実行情報" >> $GITHUB_STEP_SUMMARY
          echo "- **起動理由**: ${{ github.event.inputs.reason || '手動起動' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **タイムアウト設定**: ${{ github.event.inputs.timeout_minutes || '60' }}分" >> $GITHUB_STEP_SUMMARY
          echo "- **デバッグモード**: ${{ github.event.inputs.debug_mode == 'true' && '有効' || '無効' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **実行者**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **実行日時**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.validate-model.outputs.model_outdated }}" == "true" ]; then
            echo "- **⚠️ Geminiモデル**: 更新が必要" >> $GITHUB_STEP_SUMMARY
          fi
